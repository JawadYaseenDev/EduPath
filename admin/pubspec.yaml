name: unirah_admin
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Browser icons: regenerate with `dart run flutter_launcher_icons` after changing branding/.
flutter_launcher_icons:
  image_path: "../branding/logo-1024.png"
  android: false
  ios: false
  web:
    generate: true
    image_path: "../branding/logo-1024.png"
    background_color: "#0F6E56"
    theme_color: "#0F6E56"
